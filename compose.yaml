# mathom
# CPU stack. For NVIDIA GPUs: docker compose -f compose.yaml -f compose.gpu.yaml up -d
#
# Two containers: the single mathom image (frontend + backend + nginx) and
# Ollama. Only mathom publishes a port; Ollama stays on the internal network.

name: mathom

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mathom:latest
    restart: unless-stopped
    ports:
      # Bind to loopback by default. With auth disabled (the default) mathom has
      # no login, so it must not be reachable beyond the host out of the box.
      # Set MATHOM_BIND=0.0.0.0 for LAN access — only behind a VPN/authenticating
      # reverse proxy, or with Authentik SSO enabled. See docs/deployment.md.
      - "${MATHOM_BIND:-127.0.0.1}:${MATHOM_PORT:-8080}:8080"
    environment:
      MATHOM_DATA_DIR: /data
      # Override OLLAMA_BASE_URL to use an Ollama service in another Compose
      # project or on a private network.
      MATHOM_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      MATHOM_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      MATHOM_OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      # Optional sampled-frame video analysis. These must be passed explicitly:
      # Compose uses .env for interpolation but does not otherwise inject it
      # into the container environment.
      MATHOM_VISION_ENABLED: ${MATHOM_VISION_ENABLED:-false}
      MATHOM_VISION_MODEL: ${MATHOM_VISION_MODEL:-gemma3:4b}
      MATHOM_VISION_MAX_FRAMES: ${MATHOM_VISION_MAX_FRAMES:-24}
      MATHOM_VISION_BATCH_SIZE: ${MATHOM_VISION_BATCH_SIZE:-4}
      MATHOM_VISION_SAMPLE_INTERVAL_SECONDS: ${MATHOM_VISION_SAMPLE_INTERVAL_SECONDS:-30}
      MATHOM_VISION_FRAME_MAX_WIDTH: ${MATHOM_VISION_FRAME_MAX_WIDTH:-1024}
      MATHOM_VISION_JPEG_QUALITY: ${MATHOM_VISION_JPEG_QUALITY:-85}
      MATHOM_VISION_TIMEOUT_SECONDS: ${MATHOM_VISION_TIMEOUT_SECONDS:-300}
      MATHOM_VISION_MAX_OBSERVATION_CHARS: ${MATHOM_VISION_MAX_OBSERVATION_CHARS:-50000}
      MATHOM_WHISPER_MODEL: ${WHISPER_MODEL:-small}
      MATHOM_WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      MATHOM_WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      MATHOM_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MATHOM_MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-25}
      MATHOM_CHAT_CONCURRENCY: ${CHAT_CONCURRENCY:-1}
      # Optional local user management + Authentik SSO (disabled by default).
      MATHOM_AUTH_ENABLED: ${MATHOM_AUTH_ENABLED:-${AUTH_ENABLED:-false}}
      MATHOM_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      MATHOM_SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      MATHOM_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MATHOM_AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:-}
      # Optional SMTP invitation delivery. Use a provider-verified From address.
      MATHOM_SMTP_HOST: ${SMTP_HOST:-}
      MATHOM_SMTP_PORT: ${SMTP_PORT:-465}
      MATHOM_SMTP_USERNAME: ${SMTP_USERNAME:-}
      MATHOM_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MATHOM_SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      MATHOM_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mathom}
      MATHOM_SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      MATHOM_INVITE_EXPIRY_HOURS: ${INVITE_EXPIRY_HOURS:-168}
      # "Your Mathom is ready" notifications (Web Push, ntfy, webhook). Nothing is
      # sent until a user sets up a channel; false switches all of it off.
      MATHOM_NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      MATHOM_WEB_PUSH_CONTACT: ${WEB_PUSH_CONTACT:-}
      # Optional watched folder: the path *inside* the container (e.g. /inbox)
      # of the folder mounted below. Empty = off. See docs/ingest.md.
      MATHOM_INBOX_DIR: ${INBOX_DIR:-}
      MATHOM_INBOX_OWNER_EMAIL: ${INBOX_OWNER_EMAIL:-}
      MATHOM_INBOX_POLL_SECONDS: ${INBOX_POLL_SECONDS:-30}
      MATHOM_INBOX_TEMPLATE: ${INBOX_TEMPLATE:-general-summary}
      MATHOM_INBOX_TEMPLATE_LANGUAGE: ${INBOX_TEMPLATE_LANGUAGE:-en}
      MATHOM_AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      MATHOM_AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      MATHOM_AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      MATHOM_AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email}
    volumes:
      - mathom-data:/data
      - whisper-models:/models
      # Watched folder (optional): uncomment, point at e.g. your Syncthing copy
      # of WhatsApp's Voice Notes, and set INBOX_DIR=/inbox. Read-only is fine;
      # Mathom never changes these files.
      # - ${INBOX_HOST_DIR:?set INBOX_HOST_DIR}:/inbox:ro
    depends_on:
      ollama:
        condition: service_started
    networks:
      - mathom
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ollama:
    # Pinned for reproducible, auditable deployments. Bump deliberately;
    # override with OLLAMA_IMAGE if you track a different release.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.1}
    restart: unless-stopped
    # No ports: Ollama is only reachable on the internal network.
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - mathom
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mathom:

volumes:
  mathom-data:
  ollama-models:
  whisper-models:
